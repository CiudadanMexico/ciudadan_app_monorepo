<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <title>Ciudadan — símbolo neón rosa, fondo transparente</title>
  <desc>Vector SVG con las partes rosas rellenas, degradado neón y brillo, sin fondo.</desc>

  <defs>
    <linearGradient id="pinkFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8de5"/>
      <stop offset="22%" stop-color="#ff45c8"/>
      <stop offset="55%" stop-color="#f000a8"/>
      <stop offset="82%" stop-color="#d40086"/>
      <stop offset="100%" stop-color="#ff2bbf"/>
    </linearGradient>

    <radialGradient id="discFill" cx="48%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffd5f3"/>
      <stop offset="35%" stop-color="#ff9cdd"/>
      <stop offset="72%" stop-color="#ff55c9"/>
      <stop offset="100%" stop-color="#ed009f"/>
    </radialGradient>

    <filter id="neonGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20" result="blur1"/>
      <feColorMatrix in="blur1" type="matrix"
        values="1 0 0 0 1
                0 0.05 0 0 0
                0 0 1 0 0.55
                0 0 0 1 0" result="pinkBlur"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2"/>
      <feMerge>
        <feMergeNode in="pinkBlur"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- TRANSPARENT BACKGROUND: intentionally no rect/background element -->

  <!-- Soft outer aura, still transparent outside the logo -->
  <g fill="none" stroke="#ff16b7" opacity="0.72" filter="url(#softGlow)">
    <circle cx="500" cy="500" r="440" stroke-width="22"/>
    <circle cx="500" cy="500" r="365" stroke-width="16"/>
  </g>

  <!-- Main neon emblem -->
  <g filter="url(#neonGlow)" stroke="#ffd7f4" stroke-width="7"
     stroke-linejoin="round" stroke-linecap="round">

    <!-- Outer rings -->
    <circle cx="500" cy="500" r="440"
            fill="none" stroke="url(#pinkFill)" stroke-width="24"/>
    <circle cx="500" cy="500" r="365"
            fill="url(#discFill)" stroke="url(#pinkFill)" stroke-width="16"/>

    <!-- Pink filled outer/circuit-arrow form -->
    <path d="M 605.32 210.96 L 607.66 213.30 L 607.66 271.81 L 677.87 271.81 L 679.04 270.64 L 681.38 272.98 L 681.38 315.11 L 682.55 316.28 L 808.94 316.28 L 810.11 318.62 L 773.83 378.30 L 771.49 384.15 L 745.74 426.28 L 742.23 434.47 L 732.87 448.51 L 725.85 462.55 L 716.49 476.60 L 709.47 490.64 L 703.62 498.83 L 701.28 504.68 L 666.17 564.36 L 666.17 566.70 L 680.21 566.70 L 682.55 569.04 L 682.55 708.30 L 680.21 710.64 L 607.66 710.64 L 607.66 772.66 L 606.49 773.83 L 551.49 773.83 L 526.91 819.47 L 515.21 838.19 L 510.53 848.72 L 507.02 851.06 L 491.81 825.32 L 488.30 817.13 L 477.77 800.74 L 469.57 784.36 L 467.23 782.02 L 463.72 773.83 L 426.28 773.83 L 425.11 772.66 L 425.11 708.30 L 418.09 707.13 L 405.21 702.45 L 385.32 690.74 L 366.60 673.19 L 357.23 659.15 L 350.21 645.11 L 344.36 624.04 L 344.36 617.02 L 343.19 615.85 L 343.19 564.36 L 284.68 463.72 L 281.17 455.53 L 271.81 441.49 L 269.47 435.64 L 244.89 395.85 L 241.38 387.66 L 236.70 381.81 L 209.79 333.83 L 203.94 325.64 L 200.43 317.45 L 201.60 316.28 L 365.43 316.28 L 371.28 308.09 L 392.34 288.19 L 412.23 277.66 L 422.77 274.15 L 427.45 274.15 L 427.45 213.30 L 428.62 212.13 L 601.81 212.13 Z"
          fill="url(#pinkFill)" fill-rule="evenodd"/>

    <!-- Central currency/circuit form -->
    <path d="M 462.55 244.89 L 462.55 304.57 L 461.38 305.74 L 449.68 305.74 L 448.51 306.91 L 434.47 308.09 L 423.94 311.60 L 409.89 319.79 L 397.02 332.66 L 390.00 343.19 L 384.15 356.06 L 380.64 368.94 L 379.47 388.83 L 378.30 390.00 L 378.30 606.49 L 379.47 607.66 L 380.64 621.70 L 388.83 641.60 L 397.02 653.30 L 407.55 662.66 L 422.77 670.85 L 429.79 673.19 L 441.49 674.36 L 442.66 675.53 L 460.21 675.53 L 461.38 676.70 L 461.38 737.55 L 462.55 738.72 L 488.30 738.72 L 489.47 737.55 L 489.47 676.70 L 490.64 675.53 L 544.47 675.53 L 545.64 676.70 L 545.64 738.72 L 573.72 738.72 L 573.72 676.70 L 574.89 675.53 L 646.28 675.53 L 647.45 674.36 L 646.28 673.19 L 646.28 599.47 L 448.51 599.47 L 447.34 598.30 L 447.34 388.83 L 449.68 386.49 L 646.28 386.49 L 646.28 311.60 L 647.45 306.91 L 646.28 305.74 L 574.89 305.74 L 573.72 304.57 L 573.72 246.06 L 572.55 244.89 L 546.81 244.89 L 545.64 246.06 L 545.64 304.57 L 544.47 305.74 L 490.64 305.74 L 489.47 304.57 L 489.47 246.06 L 488.30 244.89 Z"
          fill="url(#discFill)" fill-rule="evenodd"/>
  </g>

  <!-- Crisp neon edge -->
  <g fill="none" stroke="#fff1fb" stroke-width="5"
     stroke-linejoin="round" stroke-linecap="round" opacity="0.95">
    <circle cx="500" cy="500" r="440"/>
    <circle cx="500" cy="500" r="365"/>
  </g>
</svg>
