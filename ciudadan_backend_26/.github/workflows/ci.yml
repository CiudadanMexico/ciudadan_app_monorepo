name: CI - Strapi Backend

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: CI (Linux, Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NODE_ENV: test
      DATABASE_CLIENT: sqlite
      DATABASE_FILENAME: .tmp/test.db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Strapi build
        run: npm run build

      - name: Run tests
        run: npm test
        continue-on-error: false

      - name: Check for security vulnerabilities
        run: npm audit --audit-level=high --if-present || true

      - name: Validate Strapi configuration
        run: |
          # Verify all required environment variables are documented
          if [ -f .env.example ]; then
            echo "Environment example file exists"
          else
            echo "Warning: .env.example not found"
          fi