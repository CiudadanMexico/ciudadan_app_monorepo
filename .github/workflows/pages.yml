# =============================================================================
# pages.yml — Publica el frontend estático en GitHub Pages (rama gh-pages)
# Motivación: el deploy a polanco (deploy.yml FASE 10) falla por OOM/disco en
# el VPS; el frontend público (incl. /inauguracion) se sirve desde GitHub.
#
# URL resultante: https://ciudadanmexico.github.io/ciudadan_app_monorepo/
#
# Requiere (una vez, por un admin del repo):
#   1. Settings → Actions → General → Workflow permissions: "Read and write"
#      (para que el GITHUB_TOKEN pueda empujar gh-pages).
#   2. Settings → Pages → Source: "Deploy from a branch" → `gh-pages` → `/ (root)`.
# =============================================================================
name: Pages — frontend estático a gh-pages

on:
  push:
    branches: [main]
    paths:
      - 'ciudadan_frontend/**'
      - '.github/workflows/pages.yml'
      - 'ciudadan_backend_26/scripts/ci/check-payload-ofuscado.js'
      - 'ciudadan_backend_26/tests/check-payload-ofuscado.test.js'
  workflow_dispatch:

# El permiso de escritura se concede únicamente al job que publica gh-pages.
permissions:
  contents: read

concurrency:
  group: pages-frontend
  cancel-in-progress: true

jobs:
  guard:
    name: "Gate de seguridad — índice Git + worktree"
    # Nunca publicar desde otra rama: el contenido y la guardia deben venir de main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # El checkout debe ser limpio y el guard debe pasar antes de que otro job
      # instale dependencias o ejecute el compilador.
      - name: "Verificar checkout limpio y guardia fail-closed"
        shell: bash
        run: |
          set -e
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --porcelain --untracked-files=no)"
          node ciudadan_backend_26/scripts/ci/check-payload-ofuscado.js
          node --test ciudadan_backend_26/tests/check-payload-ofuscado.test.js

  build:
    name: "Build frontend sin source maps"
    needs: guard
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        shell: bash
        run: |
          cd ciudadano_frontend
          node -v && npm -v && df -h / && free -h | head -2
          npm ci --legacy-peer-deps --no-audit --no-fund || {
            echo "::warning::npm ci falló; fallback a npm install (runner efímero)"
            npm install --legacy-peer-deps --no-audit --no-fund
          }

      # CRA lee REACT_APP_* de process.env al compilar: no hace falta .env.production.
      - name: Build (PUBLIC_URL=. — sirve en raíz o bajo /ciudadan_app_monorepo)
        shell: bash
        run: |
          cd ciudadano_frontend
          # Invocar CRACO directamente: no ejecutar `node init` desde package.json.
          # La guardia anterior ya validó el índice Git y el worktree.
          ./node_modules/.bin/craco build
        env:
          CI: "false"
          PUBLIC_URL: "."
          # Los source maps añaden ~34 MB y han agotado `syncing_files` en Pages.
          GENERATE_SOURCEMAP: "false"
          REACT_APP_AUTH0_DOMAIN: ciudadano.us.auth0.com
          REACT_APP_AUTH0_CLIENT_ID: za265MeRdxMKuPqzdPSTL7lHL0yyg5bd
          REACT_APP_STRAPI_URL: https://back.ciudadan.org
          REACT_APP_SOCKET_URL: https://back.ciudadan.org
          REACT_APP_WIKI_URL: https://socks.ciudadan.org
          REACT_APP_PLACES_KEY: google_maps
          REACT_APP_LUMA_EVENT_URL: https://luma.com/event/evt-YkAAHIOEc2zG6Xe
          REACT_APP_LUMA_EMBED_URL: https://lu.ma/embed/event/evt-YkAAHIOEc2zG6Xe/simple

      - name: "Guardar artefacto del build"
        uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: ciudadano_frontend/build
          if-no-files-found: error
          retention-days: 1

  publish:
    name: "Publicar artefacto en gh-pages"
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Sólo este job obtiene capacidad de escritura. actions/checkout conserva la
      # credencial sólo dentro de este repositorio para el push final.
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: publish
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/download-artifact@v4
        with:
          name: pages-build
          path: publish/site

      - name: "Publicar build en rama gh-pages"
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/publish"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -R site/. .
          rm -rf site
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git commit -m "pages: build ${{ github.sha }} (automático)"
          git push origin HEAD:gh-pages
          echo "gh-pages actualizado"
