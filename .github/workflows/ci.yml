name: CI - Ciudadan Backend

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*', 'release/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  WORKING_DIR: 'ciudadan_backend_26'

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Run TypeScript type check (if tsconfig exists)
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "No tsconfig.json, skipping type check"
          fi

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi_test
        ports:
          5432:5432
        options: >-
          --health-cmd="pg_isready -U strapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi_test
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-for-ci-only
      ADMIN_JWT_SECRET: test-admin-jwt-secret-for-ci-only
      API_TOKEN_SALT: test-api-token-salt-for-ci-only
      TRANSFER_TOKEN_SALT: test-transfer-token-salt-for-ci-only
      ENCRYPTION_KEY: test-encryption-key-for-ci-only-32chars!!
      MERCADO_PAGO_ACCESS_TOKEN: TEST_TOKEN
      MERCADO_PAGO_WEBHOOK_SECRET: TEST_SECRET
      SKYDROPX_API_KEY: TEST_KEY
      SKYDROPX_API_SECRET: TEST_SECRET
      FRONTEND_URL: http://localhost:3000
      STRAPI_URL: http://localhost:1337
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U strapi; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done

      - name: Run database migrations
        run: npm run build && npx strapi db:migrate

      - name: Run unit tests
        run: node --test tests/**/*.test.js --passWithNoTests

  integration-tests:
    name: Integration Tests (Taxi 6.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi_test
        ports:
          5432:5432
        options: >-
          --health-cmd="pg_isready -U strapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi_test
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-for-ci-only
      ADMIN_JWT_SECRET: test-admin-jwt-secret-for-ci-only
      API_TOKEN_SALT: test-api-token-salt-for-ci-only
      TRANSFER_TOKEN_SALT: test-transfer-token-salt-for-ci-only
      ENCRYPTION_KEY: test-encryption-key-for-ci-only-32chars!!
      MERCADO_PAGO_ACCESS_TOKEN: TEST_TOKEN
      MERCADO_PAGO_WEBHOOK_SECRET: TEST_SECRET
      SKYDROPX_API_KEY: TEST_KEY
      SKYDROPX_API_SECRET: TEST_SECRET
      FRONTEND_URL: http://localhost:3000
      STRAPI_URL: http://localhost:1337
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U strapi; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done

      - name: Run database migrations
        run: npm run build && npx strapi db:migrate

      - name: Run Taxi 6.0 integration tests
        run: |
          # Run specific test files for Taxi 6.0
          node --test tests/membresia-precios.test.js tests/promo-idempotencia.test.js tests/apk-utils.test.js tests/delivery-qa-fase-e.test.js --passWithNoTests

      - name: Run new integration tests (Founders calendar, Idempotency, QR anti-dup)
        run: |
          node --test tests/integration/founders-calendar.test.js tests/integration/idempotency-postgres.test.js tests/integration/qr-anti-dup-postgres.test.js --passWithNoTests

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    needs: [typecheck, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Build Strapi
        run: npm run build
        env:
          NODE_ENV: production

  validate-fd32:
    name: Validate FD32 Audit Requirements
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi_test
        ports:
          5432:5432
        options: >-
          --health-cmd="pg_isready -U strapi"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi_test
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: strapi
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-for-ci-only
      ADMIN_JWT_SECRET: test-admin-jwt-secret-for-ci-only
      API_TOKEN_SALT: test-api-token-salt-for-ci-only
      TRANSFER_TOKEN_SALT: test-transfer-token-salt-for-ci-only
      ENCRYPTION_KEY: test-encryption-key-for-ci-only-32chars!!
      MERCADO_PAGO_ACCESS_TOKEN: TEST_TOKEN
      MERCADO_PAGO_WEBHOOK_SECRET: TEST_SECRET
      SKYDROPX_API_KEY: TEST_KEY
      SKYDROPX_API_SECRET: TEST_SECRET
      FRONTEND_URL: http://localhost:3000
      STRAPI_URL: http://localhost:1337
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --progress=false

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U strapi; then
              echo "PostgreSQL is ready"
              break
            fi
            sleep 2
          done

      - name: Run database migrations
        run: npm run build && npx strapi db:migrate

      - name: Run idempotency concurrent tests (real PostgreSQL)
        run: node --test tests/idempotency-concurrent.test.js --passWithNoTests

      - name: Run Founders QR anti-dup tests (real PostgreSQL)
        run: node --test tests/founders-qr-anti-dup.test.js --passWithNoTests

      - name: Run new integration tests (Founders calendar, Idempotency PostgreSQL, QR anti-dup PostgreSQL)
        run: node --test tests/integration/founders-calendar.test.js tests/integration/idempotency-postgres.test.js tests/integration/qr-anti-dup-postgres.test.js --passWithNoTests

      - name: Validate P0 Blocker 3 - CI workflow at root
        run: |
          ls -la .github/workflows/ci.yml
          grep -c "working-directory.*ciudadan_backend_26" .github/workflows/ci.yml

      - name: Validate P0 Blocker 4 - Leader kit price $400
        run: |
          grep -A2 "leader_card_kit_price_mxn" src/api/site-setting/content-types/site-setting/schema.json
          grep "\$400" src/api/leader/content-types/leader/schema.json

      - name: Verify no fallback idempotency methods
        run: |
          ! grep -r "checkAndRecordIdempotencyFallback" src/api/driver-membership/services/ src/api/leader/services/ src/api/state-partner/services/ || (echo "Fallback method found!" && exit 1)

      - name: Verify init files are clean (no obfuscation)
        run: |
          for f in init middleware/init socket-service/init; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 50 ]; then
              echo "FAIL: $f has $lines lines (expected ~30)"
              exit 1
            fi
            if grep -q "0xB2\|XOR\|Fisher-Yates\|charCodeAt\|fromCharCode" "$f"; then
              echo "FAIL: $f contains obfuscation patterns"
              exit 1
            fi
            echo "OK: $f ($lines lines, clean)"
          done