name: Seed Plaza en produccion (manual)

# Ejecuta el seed idempotente de la tienda oficial "La plaza de la tecnologia a
# tu casa" (30 productos) contra la BASE DE DATOS DE PRODUCCION (Polanco).
#
# Contexto (2026-10-28): el seed solo asignaba `publishedAt` en el path CREATE
# (bug corregido en seed/plaza-tecnologia/publicar.js), por lo que tienda y
# productos ya existentes quedaban con published_at NULL y no se servian por
# la API publica. En PROD la tienda aun no existia: el seed la crea y publica.
#
# Topologia: se escribe UNICAMENTE en Polanco (PRIMARY). Dany es standby con
# replicacion PostgreSQL en streaming (lag 0), asi que los cambios llegan solos:
# no se ejecuta dos veces ni se escribe en el standby (que es read-only).
#
# Uso: GitHub Actions > "Seed Plaza en produccion (manual)" > Run workflow.
# La nota del operador queda en el log del run.

on:
  workflow_dispatch:
    inputs:
      note:
        description: "Nota del operador (queda en el log de Actions)"
        required: false
        default: ""
      publish:
        description: "Publicar lo que falte (--publish)"
        type: boolean
        default: true

concurrency:
  group: ciudadan-seed-plaza
  cancel-in-progress: false

# Permisos minimos: este workflow solo habla por SSH con el servidor de
# produccion; no necesita leer ni escribir el repositorio via la API de GitHub.
permissions:
  contents: read

env:
  DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
  POLANCO_HOST: ${{ secrets.POLANCO_HOST }}
  DANIEL_HOST: ${{ secrets.DANIEL_HOST }}
  KH_LINES: |
    ssh.ciudadan.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAV0EIAO0Jiw5JfzkMyc9Sg8Rr/cAVhekXBavJ4zJoCW
    [ssh.ciudadan.org]:22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAV0EIAO0Jiw5JfzkMyc9Sg8Rr/cAVhekXBavJ4zJoCW
    40.233.7.3 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxBUpdSP68eAqLuSH3hN9R3/hwN99S5c1z45303mb/I
    [40.233.7.3]:22 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIxBUpdSP68eAqLuSH3hN9R3/hwN99S5c1z45303mb/I

jobs:
  seed-plaza:
    name: "Seed Plaza (tienda oficial + 30 productos) en PROD Polanco"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Preparar SSH (tunel cloudflared a Polanco)
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KH_LINES" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cat > ~/.ssh/config <<'EOF'
          Host polanco-tunnel
            HostName ssh.ciudadan.org
            User DEPLOYUSER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyCommand /usr/local/bin/cloudflared access ssh --hostname %h
          Host daniel-direct
            HostName DANIELHOST
            User DEPLOYUSER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          sed -i "s/DEPLOYUSER/$DEPLOY_USER/; s/DANIELHOST/$DANIEL_HOST/" ~/.ssh/config
          ssh -o BatchMode=yes polanco-tunnel true && echo "SSH polanco OK"

      - name: Preflight (release con el fix, P4 PRIMARY_POLANCO, categorias existentes)
        shell: bash
        run: |
          set -uo pipefail
          SHA=$(ssh -o BatchMode=yes polanco-tunnel cat /var/www/releases/ciudadan_backend/CURRENT 2>/dev/null | tail -1)
          echo "Release desplegada en Polanco: $SHA"
          [ -n "$SHA" ] || { echo "::error::No pude leer la release desplegada."; exit 1; }
          if ! ssh -o BatchMode=yes polanco-tunnel "test -f /var/www/releases/ciudadan_backend/current/ciudadan_backend_26/seed/plaza-tecnologia/publicar.js"; then
            echo "::error::La release desplegada NO trae el fix de publicacion (seed/plaza-tecnologia/publicar.js). Despliega main primero."
            exit 1
          fi
          # El arbiter P4 vive en DANIEL (arbol de produccion), no en Polanco:
          # se consulta ahi, igual que el gate del pipeline de deploy.
          P4=$(ssh -o BatchMode=yes -o ConnectTimeout=20 daniel-direct "sudo -n /usr/local/sbin/p4-executor status" 2>&1 || true)
          echo "$P4" | head -20
          echo "$P4" | grep -q "PRIMARY_POLANCO" || {
            echo "::error::P4 no esta en PRIMARY_POLANCO: no se escribe en produccion."
            exit 1
          }
          # No correr el seed mientras haya un deploy en curso en Polanco: el
          # prune del deploy puede borrar la release que el seed esta usando
          # (el 2026-10-28 dejo el seed colgado con la release eliminada).
          for i in $(seq 1 60); do
            if ssh -o BatchMode=yes polanco-tunnel "pgrep -f ciudadan-deploy" >/dev/null 2>&1; then
              echo "Hay un deploy en curso en Polanco; esperando ($i/30)..."
              sleep 20
            else
              break
            fi
          done
          if ssh -o BatchMode=yes polanco-tunnel "pgrep -f ciudadan-deploy" >/dev/null 2>&1; then
            echo "::error::Sigue un deploy en curso en Polanco: no se ejecuta el seed ahora."
            exit 1
          fi
          echo "Sin deploys en curso: el seed puede usar la release actual."
          echo "PREFLIGHT_OK (release $SHA, P4 PRIMARY_POLANCO)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Preflight 2: categorias de tienda (si faltan, el seed aborta a medias)"
        shell: bash
        run: |
          set -uo pipefail
          ssh -o BatchMode=yes polanco-tunnel bash -s <<'REMOTE' | tee categorias.log
          # Tras un deploy el API puede tardar en levantar: se reintenta.
          for intento in $(seq 1 12); do
            LISTO=1
            for slug in computacion electronica-y-tecnologia; do
              n=$(curl -s --max-time 15 "http://127.0.0.1:33332/api/store-categories?filters%5Bslug%5D%5B%24eq%5D=$slug" \
                  | grep -o '"id":[0-9]*' | head -1)
              if [ -z "$n" ]; then LISTO=0; fi
              echo "categoria $slug -> ${n:-NO_ENCONTRADA}"
            done
            [ "$LISTO" = "1" ] && break
            echo "API de produccion aun no lista (intento $intento/12); esperando 15s..."
            sleep 15
          done
          REMOTE
          if grep -q "NO_ENCONTRADA" categorias.log; then
            echo "::error::Falta alguna categoria requerida por el seed. El seed no crea categorias: se aborta antes de escribir."
            exit 1
          fi

      - name: "Pre-cargar imagenes por API (el usuario de deploy no puede escribir en uploads)"
        shell: bash
        run: |
          set -uo pipefail
          # /var/www/shared/uploads es de root:alexander y el usuario de deploy no
          # puede escribir ahi (EACCES). El servicio de Strapi corre como alexander
          # y si puede: por eso las imagenes se suben por la API con el token del
          # entorno y el seed las reutiliza por nombre (plugin::upload.file).
          ssh -o BatchMode=yes polanco-tunnel "bash -s" <<'REMOTE' 2>&1 | tee imagenes.log
          set -uo pipefail
          set -a; . /var/www/shared/ciudadan_backend.env; set +a
          cd /var/www/releases/ciudadan_backend/current/ciudadan_backend_26
          DIR=seed/plaza-tecnologia
          API=http://127.0.0.1:33332/api
          TOKEN="${STRAPI_API_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "AVISO: no hay STRAPI_API_TOKEN en el env: no se pueden pre-cargar imagenes."
            exit 0
          fi
          SUBIDAS=0; REUSADAS=0; FALLOS=0
          for f in "$DIR"/images/ptc_cp_*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            if curl -s --max-time 20 -H "Authorization: Bearer $TOKEN" \
                "$API/upload/files?filters[name][$eq]=$name&pagination[pageSize]=1" | grep -q '"id"'; then
              REUSADAS=$((REUSADAS+1)); continue
            fi
            code=$(curl -s --max-time 120 -o /tmp/up.json -w "%{http_code}" \
                   -H "Authorization: Bearer $TOKEN" -F "file=@$f" "$API/upload" || echo 000)
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              SUBIDAS=$((SUBIDAS+1))
            else
              FALLOS=$((FALLOS+1))
              echo "FALLO imagen $name -> HTTP $code $(head -c 160 /tmp/up.json 2>/dev/null)"
              if [ "$code" = "403" ]; then
                echo "ABORTO: el token no tiene permiso de subida (403). El seed sube las imagenes directamente."
                break
              fi
            fi
          done
          echo "IMAGENES: subidas=$SUBIDAS reutilizadas=$REUSADAS fallos=$FALLOS"
          REMOTE

      - name: "Ejecutar seed (--apply [--publish]) con el usuario de deploy"
        shell: bash
        run: |
          set -uo pipefail
          ARGS="--apply"
          if [ "${{ inputs.publish }}" = "true" ]; then ARGS="$ARGS --publish"; fi
          echo "Nota del operador: ${{ inputs.note }}"
          echo "Argumentos: $ARGS"
          # El usuario de deploy (github-deploy) pertenece al grupo alexander:
          # puede leer el env de produccion y escribir en .tmp/public. No se usa
          # `sudo -u alexander` porque la sudoers de Polanco solo autoriza
          # binarios concretos (systemctl, ciudadan-deploy, preflight).
          # Los argumentos se pasan al shell remoto como posicionales: las
          # variables del shell local no cruzan el heredoc.
          ssh -o BatchMode=yes polanco-tunnel "bash -s -- $ARGS" <<'REMOTE' 2>&1 | tee seed.log
          set -a; . /var/www/shared/ciudadan_backend.env; set +a
          cd /var/www/releases/ciudadan_backend/current/ciudadan_backend_26

          # Owner de la tienda: el del env de produccion; si no existe, un usuario admin.
          if [ -z "$PLAZA_STORE_OWNER_ID" ]; then
            OWNER=$(node -e '
              const { Client } = require("pg");
              const cfg = {
                host: process.env.DATABASE_HOST || "127.0.0.1",
                port: Number(process.env.DATABASE_PORT || 5432),
                user: process.env.DATABASE_USERNAME,
                password: process.env.DATABASE_PASSWORD,
                database: process.env.DATABASE_NAME,
              };
              (async () => {
                const c = new Client(cfg);
                try {
                  await c.connect();
                  // El nombre de la tabla puente y de la columna de roles varian
                  // entre instalaciones: se prueban candidatas y se usa la
                  // primera que responda.
                  const cands = [
                    "select u.id, u.email from up_users u join up_users_roles_links l on l.up_users_id = u.id join up_roles r on r.id = l.up_roles_id where r.type in ($$admin$$,$$root$$) order by u.id limit 1",
                    "select u.id, u.email from up_users u join up_users_roles_links l on l.user_id = u.id join up_roles r on r.id = l.role_id where r.type in ($$admin$$,$$root$$) order by u.id limit 1",
                    "select id, email from up_users where coalesce(roles_extra::text, $$$$) ~* $$(admin|root)$$ order by id limit 1",
                    "select id, email from up_users where coalesce(roles::text, $$$$) ~* $$(admin|root)$$ order by id limit 1"
                  ];
                  for (const q of cands) {
                    try {
                      const r = await c.query(q);
                      if (r.rows.length) { console.log(r.rows[0].id + "|" + r.rows[0].email); return; }
                    } catch (e) { /* siguiente candidata */ }
                  }
                  console.log("ERR|no se encontro owner admin");
                } catch (e) { console.log("ERR|" + e.message); }
                finally { await c.end().catch(() => {}); }
              })();
            ' 2>/dev/null | tail -1)
            case "$OWNER" in
              ERR\|*) echo "AVISO: no se pudo resolver owner admin ($OWNER); la tienda quedara sin owner." ;;
              *\|*) export PLAZA_STORE_OWNER_ID="${OWNER%%|*}"; export PLAZA_STORE_EMAIL="${OWNER##*|}"; echo "Owner resolved: id=$PLAZA_STORE_OWNER_ID email=$PLAZA_STORE_EMAIL" ;;
            esac
          else
            echo "Owner desde env de produccion: id=$PLAZA_STORE_OWNER_ID"
          fi

          NODE_ENV=production node seed/plaza-tecnologia/seed-plaza-tecnologia.js "$@"
          RC=$?
          echo "SEED_EXIT=$RC"
          exit $RC
          REMOTE
          if ! grep -q "SEED_EXIT=0" seed.log; then
            echo "::error::El seed no termino con exito 0 (ver seed.log)."
            exit 1
          fi
          grep -E "^(Tienda|CREATE|UPDATE|REFRESCO|ANOMALIA|SIN-CAMBIO|AVISO|ERROR|CONFLICTO|Errores)" seed.log | head -60 | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Verificacion (API de produccion)
        shell: bash
        run: |
          set -uo pipefail
          URL='https://back.ciudadan.org/api/productos?filters%5Bstore%5D%5Bslug%5D%5B%24eq%5D=la-plaza-de-la-tecnologia-a-tu-casa&pagination%5BpageSize%5D=50'
          curl -sS --max-time 40 "$URL" -o productos.json || {
            echo "::error::No se pudo consultar la API publica de produccion."
            exit 1
          }
          node -e '
            const fs = require("fs");
            const j = JSON.parse(fs.readFileSync("productos.json", "utf8"));
            const d = Array.isArray(j.data) ? j.data : [];
            const pub = d.filter((p) => p.attributes && p.attributes.publishedAt);
            const sin = d.filter((p) => p.attributes && !p.attributes.publishedAt);
            const linea = "Plaza en PROD: " + d.length + " productos | publicados: " + pub.length + " | sin publicar: " + sin.length;
            console.log(linea);
            if (sin.length) console.log("SIN PUBLICAR: " + sin.map((p) => p.attributes.slug).join(", "));
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, linea + "\n");
            if (d.length === 0) { console.error("La API publica no devolvio productos de la tienda Plaza."); process.exit(1); }
            if (sin.length) { console.error("Quedan productos sin publicar."); process.exit(1); }
          '
